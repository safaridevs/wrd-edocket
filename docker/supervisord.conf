; Three processes per container. supervisord passes its own environment down,
; and the app's .env is bind-mounted into /var/www/html, so every program below
; sees the same configuration Apache does. (A cron-driven scheduler would not:
; cron jobs start with an empty environment.)

[program:apache]
command=/usr/local/bin/apache2-foreground
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Nothing in the app is ShouldQueue today (QUEUE_CONNECTION=database is only
; used synchronously), so this worker idles; it is here so a queued job added
; later runs without a deployment change.
[program:queue-worker]
command=php /var/www/html/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; routes/console.php schedules email:process-bounces every five minutes.
[program:scheduler]
command=/bin/sh -c 'while true; do php /var/www/html/artisan schedule:run --no-interaction; sleep 60; done'
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
