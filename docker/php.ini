; E-Docket runtime overrides (production ini is the base image default).
; Filings are PDFs; allow a generous upload.
upload_max_filesize = 64M
post_max_size = 72M
memory_limit = 512M
max_execution_time = 120

; Opcache for a code tree that only changes on redeploy.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000

expose_php = Off
log_errors = On
error_log = /dev/stderr
