# E-Docket QAT stack. Copied by ose_edocket.groovy to
# /opt/apps/edocket/qat/docker-compose.yaml on the QAT host and started with
#   IMAGE_TAG=<tag> docker compose --env-file .env_docker_compose --file docker-compose.yaml up -d
# Relative paths resolve against that directory.
#
# name: is mandatory. Without it compose derives the project from the directory
# ("qat"), which wrats2 also uses, and `down --remove-orphans` for one app
# would remove the other's containers. See ~/ose-engineering/port-register.md.
name: edocket-qat

services:
  # Renders the application .env from .env.template + Azure Key Vault into the
  # `secrets` tmpfs volume, then stays up. Host network because the Azure Arc
  # identity endpoint listens on the host loopback only; it publishes nothing.
  # Runs as root to read the Arc challenge token (root/himds group readable).
  secrets:
    image: edocket-app:${IMAGE_TAG}
    container_name: edocket-qat-secrets
    entrypoint: ["/usr/local/bin/edocket-secrets"]
    network_mode: host
    environment:
      SECRETS_PREFIX: edocket-qat
      SECRETS_VAULT: ${SECRETS_VAULT}
      SECRETS_REFRESH_SECONDS: ${SECRETS_REFRESH_SECONDS:-0}
      AZURE_AUTH: ${AZURE_AUTH:-arc}
      AZURE_KEYVAULT_URL: ${AZURE_KEYVAULT_URL:-}
      AZURE_KEYVAULT_RESOURCE: ${AZURE_KEYVAULT_RESOURCE:-https://vault.azure.net}
      AZURE_AUTHORITY_HOST: ${AZURE_AUTHORITY_HOST:-https://login.microsoftonline.com}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
    volumes:
      - ./.env.template:/etc/edocket/env.template:ro
      # Arc managed identity challenge tokens (absent and empty when Arc is not installed).
      - /var/opt/azcmagent/tokens:/var/opt/azcmagent/tokens:ro
      # Service-principal certificate for AZURE_AUTH=certificate: <dir>/client.pem
      - ${EDOCKET_IDENTITY_DIR}:/etc/edocket/identity:ro
      - secrets:/run/edocket
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/edocket/.env"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 5s
    restart: unless-stopped

  app:
    image: edocket-app:${IMAGE_TAG}
    container_name: edocket-qat
    depends_on:
      secrets:
        condition: service_healthy
    ports:
      - "${EDOCKET_APP_PORT}:80"
    volumes:
      # Rendered .env, read-only: nothing in the container can rewrite it
      # (key:generate included). /var/www/html/.env symlinks into it.
      - secrets:/run/edocket:ro
      # Document store and logs outlive the container.
      - ${EDOCKET_APP_STORAGE}:/var/www/html/storage/app
      - ${EDOCKET_APP_LOGS}:/var/www/html/storage/logs
    restart: unless-stopped

volumes:
  # RAM only: the rendered secrets never touch the host disk and vanish on reboot,
  # when the secrets service renders them again.
  secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=1m,mode=0750,uid=0,gid=33"
