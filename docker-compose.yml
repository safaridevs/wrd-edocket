
# Local development and cross-driver testing harness.
# The app container carries pdo_sqlite, pdo_mysql, pdo_pgsql and pdo_sqlsrv so
# the same migration history can be exercised against every supported driver.

services:
  app:
    build: ./docker/php
    working_dir: /app
    volumes:
      - .:/app
    # Kept on 8000 to match the origins allowed in vite.config.js.
    ports:
      - "8000:8000"
    # Deliberately no DB_* here: real environment variables win over .env in
    # Laravel, so hardcoding them would silently ignore your .env. Set DB_HOST
    # to the service name (mysql, postgres or mssql) in .env instead.
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      mysql:
        condition: service_started
      postgres:
        condition: service_started
      mssql:
        condition: service_started
      docstore-init:
        condition: service_completed_successfully

  # Local stand-in for the shared S3-compatible document store (ARCH-11): the same
  # versitygw release and settings as ose-app-data-store. Used only when .env sets
  # DOCUMENTS_DRIVER=s3 (see .env.example); otherwise documents go to storage/app/private.
  docstore:
    image: ghcr.io/versity/versitygw:v1.8.0
    entrypoint: ["/bin/sh", "-c", "mkdir -p /data/gw /data/versions && exec /usr/local/bin/docker-entrypoint.sh"]
    environment:
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data/gw
      VGW_VERSIONING_DIR: /data/versions
      VGW_PORT: ":7070"
      ROOT_ACCESS_KEY_ID: EDOCKETLOCALDEV0001
      ROOT_SECRET_ACCESS_KEY: edocket-local-dev-only-secret
    ports:
      - "17070:7070"
    volumes:
      - docstore-data:/data

  # Creates the local bucket once, with versioning and object lock as on QAT.
  docstore-init:
    image: amazon/aws-cli
    depends_on:
      - docstore
    environment:
      AWS_ACCESS_KEY_ID: EDOCKETLOCALDEV0001
      AWS_SECRET_ACCESS_KEY: edocket-local-dev-only-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        s3() { aws --endpoint-url http://docstore:7070 "$$@"; }
        for i in $$(seq 1 30); do s3 s3 ls >/dev/null 2>&1 && break; sleep 1; done
        if s3 s3api head-bucket --bucket sonm-ose-edocket-local >/dev/null 2>&1; then
          echo "bucket sonm-ose-edocket-local already exists"
        else
          s3 s3api create-bucket --bucket sonm-ose-edocket-local --object-lock-enabled-for-bucket
          s3 s3api put-bucket-versioning --bucket sonm-ose-edocket-local --versioning-configuration Status=Enabled
          echo "created bucket sonm-ose-edocket-local"
        fi

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: edocket_wrd
      MYSQL_USER: edocket
      MYSQL_PASSWORD: secret
    ports:
      - "33061:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: edocket_wrd
      POSTGRES_USER: edocket
      POSTGRES_PASSWORD: secret
    ports:
      - "54321:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edocket -d edocket_wrd"]
      interval: 5s
      timeout: 5s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Str0ng!Passw0rd"
      MSSQL_PID: Developer
    ports:
      - "14331:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  postgres-data:
  mssql-data:
  docstore-data:
